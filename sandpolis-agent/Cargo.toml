[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-agent"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
axum-macros = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
inventory = { workspace = true }
native_db = { workspace = true }
native_model = { workspace = true }
russh = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
tracing = { workspace = true }
dirs = { version = "7", optional = true }
bevy = { workspace = true, optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }

# Terminal (TUI/CLI) dependencies, excluded on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
agent = ["sandpolis-instance/agent"]
client = [
  "sandpolis-instance/client",
  "dep:bevy",
  "dep:dirs",
  "dep:ratatui",
  "dep:sandpolis-client",
  "dep:serde_cbor",
  "sandpolis-client/client",
]
server = ["dep:russh", "sandpolis-instance/server"]

[[example]]
name = "client_tui"
required-features = ["client"]
