# Example jail for the Sandpolis server. Copy into /etc/fail2ban/jail.d/ and
# set enabled = true.

[sandpolis]
enabled = false
filter = sandpolis
port = 8768
# The server listens on that port twice: HTTPS over TCP for logins and other
# one-off requests, and WebTransport over UDP for attachments. A failure is
# logged from either, so ban the address on every port rather than on one
# protocol of the two.
banaction = iptables-allports
maxretry = 5
findtime = 10m
bantime = 1h

# The server logs to stderr. Under systemd that lands in the journal, which
# the systemd backend reads directly (the filter's journalmatch expects the
# unit to be named sandpolis.service).
backend = systemd

# When not running under systemd, capture stderr to a file instead and point
# fail2ban at it:
# backend = auto
# logpath = /var/log/sandpolis/server.log
