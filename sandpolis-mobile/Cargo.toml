[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-mobile"
publish = false

# This version doesn't mean anything because this crate is just a wrapper
version = "0.0.1"

[lib]
name = "sandpolis_mobile"
crate-type = ["lib", "cdylib"]

[dependencies]
bevy = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
sandpolis = { path = "../sandpolis", version = "8.0.0", default-features = false, features = [
  "client",
  "agent",
  "desktop",
  "inventory",
  "shell",
] }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# Android-specific dependencies
jni = "0.22.4"
ndk-context = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
paranoid-android = "0.2"
