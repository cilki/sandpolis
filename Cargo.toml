[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[workspace]
resolver = "2"
members = [
  "sandpolis",
  "sandpolis-account",
  "sandpolis-agent",
  "sandpolis-audit",
  "sandpolis-client",
  "sandpolis-desktop",
  "sandpolis-filesystem",
  "sandpolis-health",
  "sandpolis-instance",
  "sandpolis-inventory",
  "sandpolis-macros",
  "sandpolis-mobile",
  "sandpolis-probe",
  "sandpolis-server",
  "sandpolis-shell",
  "sandpolis-snapshot",
  "sandpolis-tunnel",
]

[workspace.dependencies]
anyhow = "1.0.100"
aws-lc-rs = "1.12.1"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-macros = "0.5.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum = { version = "0.8.8", features = ["ws", "json"] }
base64 = "0.23.1"
blake3 = "1"
bollard = { version = "0.19", features = ["ssl"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.4.7", features = ["derive", "env", "string"] }
colored = "3.0.0"
cron = { version = "0.17.0", features = ["serde"] }
futures = "0.3.30"
futures-util = "0.3.31"
gethostname = "1.1.0"
headers = "0.4.1"
image = "0.25.5"
macaddr = { version = "1", features = ["serde"] }
native_db = { git = "https://github.com/vincent-herlemont/native_db", features = [
  "tokio",
] }
native_model = "0.6.1"
notify = "8.2"
os_info = "3.8.2"
passwords = { version = "3.1.16" }
pem = "4.0.0"
pty-process = { version = "0.5.3", features = ["async"] }
png = "0.18.1"
rand = "0.10.1"
regex = "1.11.1"
ron = "0.12.0"
russh = { version = "0.62.5" }
rustls = { version = "0.23.36", default-features = false, features = [
  "aws_lc_rs",
] }
serde_bytes = "0.11.15"
# Builds on `sspi 0.21`, so its crypto stack unifies with `russh`'s
# (`crypto-bigint 0.7`, `hmac 0.13`, `sha2 0.11`) instead of demanding an older
# release-candidate generation. Exactly one threading model may be enabled, and
# `kerberos` must stay off: it routes NTLM through SPNEGO, which Samba rejects.
smb = { version = "0.12.1", default-features = false, features = [
  "async",
  "sign",
  "encrypt",
  "compress",
] }
# Share enumeration goes over MS-SRVS, and `smb` doesn't re-export the types its
# own `list_shares` returns.
smb-rpc = "0.12.1"
serde_cbor = "0.11.2"
serde_json = "1.0.134"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = { version = "3.12.0", features = ["chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.17.0"
time = { version = "0.3.37" }
tokio-rustls = "0.26.0"
tokio-stream = "0.1.17"
tokio-util = "0.7.15"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.2"
roniker = { git = "https://github.com/fossable/roniker" }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.40"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.15.1", features = ["v7", "serde", "rng-getrandom"] }
validator = { version = "0.21", features = ["derive"] }
inventory = "0.3"
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }
zstd = "0.13"
reqwest = { version = "0.13.4", default-features = false, features = [
  "stream",
  "cookies",
  "json",
  "rustls",
  "charset",
] }
reqwest-websocket = "0.6.0"

# Terminal client exclusive
ratatui = { version = "0.30.0", features = ["unstable"] }
ratatui-image = { version = "11.0.4", default-features = false, features = [
  "image-defaults",
  "crossterm",
] }
tui-popup = { version = "0.7.2" }

# GUI client exclusive
alacritty_terminal = { version = "0.26.0", default-features = false }
bevy = { version = "0.19.0", features = ["bevy_dev_tools", "bevy_scene"] }
bevy_svg = { git = "https://github.com/cilki/bevy_svg", features = ["2d"] }
bevy_rapier2d = "0.36.0"
bevy_ui_widgets = { version = "0.19.0" }
resvg = { version = "0.48.1" }
include_dir = { version = "0.7" }

# Published `sspi 0.21.3` pins macOS/iOS-only release candidates of
# `curve25519-dalek`, `ed25519-dalek` and `p256`/`p384`/`p521` that no published
# `russh` agrees with, so the graph cannot resolve with both. This rev is the
# last one still declaring 0.21.3 (which `smb` requires exactly) and it already
# moves those pins to the stable releases. Drop the patch once a release past
# 0.21.3 that `smb` accepts exists.
#
# That rev requires `picky =7.0.0-rc.26` while published `ironrdp-connector`
# requires `=7.0.0-rc.25`, which is why the connector is vendored with nothing
# but that one requirement bumped (see vendor/README.md).
[patch.crates-io]
sspi = { git = "https://github.com/Devolutions/sspi-rs", rev = "4878c50503b204bba95def66ca7d45e6d396f898" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
