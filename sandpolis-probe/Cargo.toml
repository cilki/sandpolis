[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-probe"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
# The `sync` feature must stay off: it is `maybe-async/is_sync`, and because
# that's a feature of a shared *proc-macro* crate it applies to every
# `#[maybe_async]` user in the graph - including `smb-transport`, whose tokio
# code only compiles in async mode. Nothing is lost by leaving it off: the async
# API blocks internally anyway (pnet underneath), which is why `scan::arp_sweep`
# drives it with `block_on` from inside `spawn_blocking`.
arp-toolkit = { version = "0.3.2", optional = true }
bollard = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
futures = { workspace = true }
inventory = { workspace = true }
ipmi-rs = { version = "0.6.0", optional = true }
macaddr = { workspace = true }
nfs3_client = { version = "0.9", optional = true, features = ["tokio"] }
openh264 = { version = "0.9", optional = true }
pnet = { version = "0.34", optional = true }
rasn-snmp = { version = "0.28.13", optional = true }
retina = { version = "0.4", optional = true }
rups = { version = "0.6", optional = true }
russh = { workspace = true, optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
sandpolis-server = { path = "../sandpolis-server", version = "0.0.1" }
serde_cbor = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true }
smb = { workspace = true, optional = true }
smb-rpc = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
vnc = { version = "0.4", optional = true }

# GUI dependencies
bevy = { workspace = true, optional = true }
bevy_svg = { workspace = true, optional = true, features = ["2d"] }
bevy_rapier2d = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }

# Terminal (TUI/CLI) dependencies, excluded on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui = { workspace = true, optional = true }

[dev-dependencies]
ron = { workspace = true }
# SMB timestamps are `time` values; the unit tests build them directly.
time = { workspace = true, features = ["macros"] }

[features]
agent = [
  "dep:rups",
  "dep:vnc",
  "dep:russh",
  "dep:retina",
  "dep:tokio-util",
  "sandpolis-server/agent",
]
# Only servers connect to probes, so the filesystem protocol clients are here
# and not in `agent`.
server = [
  "dep:arp-toolkit",
  "dep:pnet",
  "dep:bollard",
  "dep:nfs3_client",
  "dep:smb",
  "dep:smb-rpc",
  "dep:rups",
  "dep:vnc",
  "dep:russh",
  "dep:retina",
  "dep:tokio-util",
  "sandpolis-server/server",
]
client = [
  "dep:bevy",
  "dep:clap",
  "dep:bevy_svg",
  "dep:bevy_rapier2d",
  "dep:include_dir",
  "dep:openh264",
  "dep:serde_cbor",
  "dep:serde_json",
  "dep:sandpolis-client",
  "dep:ratatui",
  "sandpolis-client/client",
  "sandpolis-server/client",
]
