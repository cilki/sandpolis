[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-instance"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum-server = { workspace = true, optional = true }
axum-macros = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bevy = { workspace = true, optional = true } # TODO avoid with newtypes?
chrono = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
futures-util = { workspace = true }
futures = { workspace = true }
headers = { workspace = true, optional = true }
inventory = { workspace = true }
native_db = { workspace = true }
native_model = { workspace = true }
os_info = { workspace = true }
pem = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rcgen = { version = "0.14.10", optional = true, features = [
  "crypto",
  "pem",
  "x509-parser",
] }
reqwest = { workspace = true, optional = true }
ron = { workspace = true }
rustls-pki-types = { version = "1.15.1" }
rustls = { workspace = true }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
wtransport = { workspace = true, optional = true }
x509-parser = { version = "0.18.1" }

# Native notification backends. Optional and per-target, all switched on
# together by the `client` feature — only a client shows notifications to a
# person. Same arrangement as `sandpolis-desktop`'s capture/input backends.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
notify-rust = { version = "4.18", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", optional = true }
ndk-context = { version = "0.1", optional = true }

[dev-dependencies]
test-log = { version = "0.2.21", features = ["trace"] }

# `test-util` is not part of tokio's `full`, and the socket tests need a paused
# clock to reach the keepalive deadline without waiting for it.
tokio = { workspace = true, features = ["test-util"] }
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# Used to test certificate authentication with a different backend
openssl = "0.10.81"


[[bench]]
name = "database_bench"
harness = false

[features]
agent = ["dep:reqwest", "dep:wtransport"]
client = [
  "dep:reqwest",
  "dep:wtransport",
  "dep:bevy",
  # Native notification backends; each is a no-op off its own platform.
  "dep:notify-rust",
  "dep:jni",
  "dep:ndk-context",
]
server = [
  "dep:reqwest",
  "dep:wtransport",
  "dep:rcgen",
  "dep:tokio-rustls",
  "dep:tower",
  "dep:axum",
  "dep:axum-macros",
  "dep:axum-server",
  "dep:headers",

]
