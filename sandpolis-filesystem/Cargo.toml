[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-filesystem"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
axum-macros = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, optional = true }
fuser = { version = "0.18.0", optional = true, features = ["serializable"] }
inventory = { workspace = true }
notify = { workspace = true, optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-probe = { path = "../sandpolis-probe", version = "0.0.1", optional = true }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
serde = { workspace = true }
serde_cbor = { workspace = true, optional = true }
sysinfo = { version = "0.39.3", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }

# GUI dependencies
bevy = { workspace = true, optional = true }

# Terminal (TUI/CLI) dependencies, excluded on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui = { workspace = true, optional = true }
color-eyre = { version = "0.6.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[features]
agent = ["dep:notify", "dep:sysinfo", "dep:tokio"]
# Browse probe devices that expose a filesystem (NFS, SMB). All protocol
# handling lives in the probe subsystem behind `sandpolis_probe::filesystem`.
probe = ["dep:sandpolis-probe"]
client = [
  "dep:fuser",
  "dep:bevy",
  "dep:sandpolis-client",
  "dep:ratatui",
  "dep:chrono",
  "dep:serde_cbor",
  "dep:tokio",
  "dep:color-eyre",
  "sandpolis-client/client",
  # The probe browser reads `sandpolis_probe::filesystem::client`, which only
  # exists with the probe subsystem's own client feature on.
  "sandpolis-probe?/client",
]
server = []

[[example]]
name = "client_tui"
required-features = ["client"]
