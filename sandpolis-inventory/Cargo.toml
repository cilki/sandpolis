[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-inventory"
version = "0.0.1"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
os_info = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
native_db = { workspace = true }
tokio = { workspace = true }
native_model = { workspace = true }
inventory = { workspace = true }
sysinfo = { version = "0.39.6", optional = true }
which = { version = "8", optional = true }
regex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
liblzma = { version = "0.4", features = ["static"], optional = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-agent = { path = "../sandpolis-agent", version = "0.0.1", optional = true }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }

# GUI dependencies
bevy = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }

[features]
agent = [
  "sandpolis-instance/agent",
  "dep:sysinfo",
  "dep:sandpolis-agent",
  "sandpolis-agent/agent",
  "dep:which",
  "dep:regex",
  "dep:serde_json",
]
# Boot agent: only the hardware collectors run; the OS-level collectors
# (packages, users, mountpoints) are compiled out since the UKI environment
# has no OS of its own worth reporting.
uki = []
server = [
  "sandpolis-instance/server",
  "dep:chrono",
  "dep:liblzma",
  "dep:reqwest",
  "dep:serde_json",
  "dep:tokio-util",
]
client = [
  "dep:bevy",
  "dep:include_dir",
  "dep:sandpolis-client",
  "sandpolis-client/client",
]
