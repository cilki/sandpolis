[package]
description = "Virtual estate monitoring & management!"
edition = "2024"
license = "Unlicense"
name = "sandpolis-desktop"
version = "0.0.1"

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
tracing = { workspace = true }
sandpolis-instance = { path = "../sandpolis-instance", version = "0.0.1" }
sandpolis-macros = { path = "../sandpolis-macros", version = "0.0.1" }
sandpolis-probe = { path = "../sandpolis-probe", version = "0.0.1", optional = true }
vnc = { version = "0.4", optional = true }
# RDP probe backend. The connector's `sspi ^0.21` matches the workspace's pinned
# `sspi` rev (see the root Cargo.toml patch); the tls crate's `rustls` feature
# resolves to aws-lc-rs, the same provider the rest of the tree uses.
ironrdp-connector = { version = "0.10", optional = true }
ironrdp-session = { version = "0.11", optional = true }
ironrdp-graphics = { version = "0.9", optional = true }
ironrdp-pdu = { version = "0.9", optional = true }
ironrdp-svc = { version = "0.8", optional = true }
ironrdp-core = { version = "0.2", optional = true }
ironrdp-input = { version = "0.7", optional = true }
ironrdp-async = { version = "0.10", optional = true }
ironrdp-tokio = { version = "0.10", features = ["reqwest"], optional = true }
ironrdp-tls = { version = "0.2", features = ["rustls"], optional = true }
tokio-util = { workspace = true, optional = true }
native_db = { workspace = true }
native_model = { workspace = true }

# Agent dependencies: screen capture & input injection. The capture and input
# modules are adapted from rustdesk's `scrap` and `enigo` crates; these are the
# leaf dependencies they pull in.
sandpolis-agent = { path = "../sandpolis-agent", version = "0.0.1", optional = true }
tokio = { workspace = true, optional = true }
zstd = { version = "0.13", optional = true }
image = { workspace = true, optional = true }
lazy_static = { version = "1.4", optional = true }
cfg-if = { version = "1.0", optional = true }
serde_json = { workspace = true, optional = true }

# Client dependencies
bevy = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
sandpolis-client = { path = "../sandpolis-client", version = "0.0.1", optional = true }
inventory = { workspace = true }
serde_cbor = { workspace = true, optional = true }

# Screen-capture / input backend for X11 & Wayland (Linux).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
libloading = { version = "0.9", optional = true }
regex = { workspace = true, optional = true }
dirs = { version = "6", optional = true }
x11 = { version = "2.21", features = ["xlib"], optional = true }
dbus = { version = "0.9", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", features = ["v1_16"], optional = true }
gstreamer-video = { version = "0.25", optional = true }
sctk = { package = "smithay-client-toolkit", version = "0.21.1", default-features = false, features = [
  "calloop",
], optional = true }
tfc = { git = "https://github.com/rustdesk-org/The-Fat-Controller", branch = "history/rebase_upstream_20240722", optional = true }

# Screen-capture / input backend for Quartz (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
core-graphics = { version = "0.25", optional = true }
objc = { version = "0.2", optional = true }
unicode-segmentation = { version = "1.10", optional = true }

# Screen-capture / input backend for DXGI (Windows).
[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3"
features = [
  "dxgi",
  "dxgi1_2",
  "dxgi1_5",
  "d3d11",
  "winuser",
  "winbase",
  "winerror",
  "errhandlingapi",
  "libloaderapi",
]
optional = true

# Screen-capture backend for Android.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", optional = true }
ndk-context = { version = "0.1", optional = true }

# Terminal (TUI/CLI) dependencies, excluded on Android
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui = { workspace = true, optional = true }
ratatui-image = { workspace = true, optional = true }

[features]
agent = [
  "dep:sandpolis-agent",
  "sandpolis-agent/agent",
  "sandpolis-instance/agent",
  "dep:tokio",
  "dep:zstd",
  "dep:image",
  "dep:lazy_static",
  "dep:cfg-if",
  "dep:serde_json",
  # Linux capture/input backend
  "dep:libc",
  "dep:libloading",
  "dep:regex",
  "dep:dirs",
  "dep:x11",
  "dep:dbus",
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-video",
  "dep:sctk",
  "dep:tfc",
  # macOS capture/input backend
  "dep:block",
  "dep:core-graphics",
  "dep:objc",
  "dep:unicode-segmentation",
  # Windows capture/input backend
  "dep:winapi",
  # Android capture backend
  "dep:jni",
  "dep:ndk-context",
]
# Client stream requesters decode frames (zstd + color modes) and screenshots
# (PNG), so they need the same codec deps as the agent encoder.
client = [
  "dep:zstd",
  "dep:image",
  "dep:tokio",
  "dep:serde_cbor",
  "dep:bevy",
  "dep:include_dir",
  "dep:sandpolis-client",
  "dep:ratatui",
  "dep:ratatui-image",
  "dep:clap",
  "sandpolis-client/client",
]
server = []
# VNC probes: the desktop subsystem can stream a device registered with the probe
# subsystem instead of an agent. The codec deps are shared with the agent/client
# encoders, and are listed again so a `server,probe` build (which has no capture
# backend) stands on its own.
probe = [
  "dep:sandpolis-probe",
  "dep:vnc",
  "dep:zstd",
  "dep:tokio",
  # RDP probe backend (IronRDP), used only on the server+probe path.
  "dep:ironrdp-connector",
  "dep:ironrdp-session",
  "dep:ironrdp-graphics",
  "dep:ironrdp-pdu",
  "dep:ironrdp-svc",
  "dep:ironrdp-core",
  "dep:ironrdp-input",
  "dep:ironrdp-async",
  "dep:ironrdp-tokio",
  "dep:ironrdp-tls",
  "dep:tokio-util",
]

[dev-dependencies]
serde_cbor = { workspace = true }
